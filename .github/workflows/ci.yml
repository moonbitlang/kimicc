name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TINYCC_REF: fad812360ba836b4ca6f52236d867476ff671633
      QUICKJS_REF: d7ae12ae71dfd6ab2997527d295014a8996fa0f9
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          moon version --all
          clang --version

      - name: Update dependencies
        run: moon update

      - name: Check shell scripts
        run: bash -n scripts/fetch-external-parser-fixtures.sh scripts/linux-amd64-smoke.sh scripts/build-linux-amd64-smoke-image.sh scripts/native-ci-test.sh

      - name: Check formatting
        run: |
          moon fmt
          if ! git diff --exit-code; then
            echo "::error::moon fmt produced changes — run 'moon fmt' locally and commit the result"
            exit 1
          fi

      - name: moon check
        run: moon check --target native

      - name: Check generated interfaces
        run: |
          moon info
          if ! git diff --exit-code; then
            echo "::error::moon info produced interface changes - run 'moon info' locally and commit the result"
            exit 1
          fi

      - name: Fetch external e2e fixtures
        run: scripts/fetch-external-parser-fixtures.sh

      - name: moon test
        run: scripts/native-ci-test.sh

  linux-amd64-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build Linux amd64 smoke image
        run: scripts/build-linux-amd64-smoke-image.sh

      - name: Linux amd64 smoke
        run: KIMICC_LINUX_AMD64_SMOKE_FORCE_DOCKER=1 scripts/linux-amd64-smoke.sh
